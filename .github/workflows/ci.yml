name: CI

"on":
  push:
    branches: ["**"]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a run on the default branch: it may be releasing, and a cut
  # release leaves a tag without its Release.
  cancel-in-progress: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write
  security-events: write

jobs:
  php:
    uses: mbologna/.github/.github/workflows/php-ci.yml@5b3cae0682365eb8818620d071f8f4d77d6440d7 # main
    with:
      php_version: "8.5"
      enable_lint: true
      lint_tools: ""
      lint_command: php -l day-of-year-calendar.php

  docker:
    needs: [php]
    uses: mbologna/.github/.github/workflows/docker-ci.yml@5b3cae0682365eb8818620d071f8f4d77d6440d7 # main
    with:
      image_name: day-of-year-calendar
      push_to_dockerhub: true
      enable_cosign: true
      enable_release_drafter: true
    secrets: inherit

  auto-release:
    # Monday's schedule and a manual run release with the strategy below; a push
    # to the default branch releases only a CVE fix (the wrapper switches to the
    # security strategy). The tag build auto-release dispatches runs on the tag
    # ref, so it does not release again.
    if: >-
      github.event_name == 'schedule' ||
      ((github.event_name == 'workflow_dispatch' || github.event_name == 'push') &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    # contents: push the tag and create the Release; actions: dispatch this
    # workflow on it, since a tag pushed with GITHUB_TOKEN triggers no run.
    permissions:
      contents: write
      actions: write
    needs: [docker]
    uses: mbologna/.github/.github/workflows/auto-release.yml@5b3cae0682365eb8818620d071f8f4d77d6440d7 # main
    with:
      strategy: docker
      image: docker.io/mbologna/day-of-year-calendar
    secrets: inherit

  deploy:
    needs: [docker]
    # A push to main only: Renovate merges in the Tue/Wed/Thu window (CVE fixes
    # at any time), and that merge is the deploy. Monday's schedule rebuilds the
    # same pinned base image, so redeploying it only moved a deploy out of the
    # window.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: mbologna/.github/.github/workflows/gcp-deploy.yml@5b3cae0682365eb8818620d071f8f4d77d6440d7 # main
    with:
      image_name: day-of-year-calendar
      deploy_type: service
      deploy_name: day-of-year-calendar
      region: us-central1
    secrets: inherit

  cache-cleanup:
    if: github.event_name == 'schedule'
    uses: mbologna/.github/.github/workflows/cache-cleanup.yml@5b3cae0682365eb8818620d071f8f4d77d6440d7 # main
    with:
      max_age_days: 7
    permissions:
      actions: write
