name: CI

"on":
  push:
    branches: ["**"]
    tags: ["v*.*.*"]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write
  security-events: write

jobs:
  php:
    uses: mbologna/.github/.github/workflows/php-ci.yml@34ce8b02522b62bb27e3d27ea66b46f6174be561 # main
    with:
      php_version: "8.5"
      enable_lint: true
      lint_tools: ""
      lint_command: php -l day-of-year-calendar.php

  docker:
    needs: [php]
    uses: mbologna/.github/.github/workflows/docker-ci.yml@34ce8b02522b62bb27e3d27ea66b46f6174be561 # main
    with:
      image_name: day-of-year-calendar
      push_to_dockerhub: true
      enable_grype: true
      enable_cosign: true
      enable_release_drafter: true
    secrets: inherit

  auto-release:
    if: github.event_name == 'schedule'
    needs: [docker]
    uses: mbologna/.github/.github/workflows/auto-release.yml@34ce8b02522b62bb27e3d27ea66b46f6174be561 # main
    with:
      strategy: docker
      image: docker.io/mbologna/day-of-year-calendar
    secrets: inherit

  deploy:
    needs: [docker]
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'schedule'
    uses: mbologna/.github/.github/workflows/gcp-deploy.yml@34ce8b02522b62bb27e3d27ea66b46f6174be561 # main
    with:
      image_name: day-of-year-calendar
      deploy_type: service
      deploy_name: day-of-year-calendar
      region: us-central1
    secrets: inherit
