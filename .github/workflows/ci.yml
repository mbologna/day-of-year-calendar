name: CI

# Tests on every push and pull request. On main (push, the weekly schedule or
# a manual run) the tested source then builds the feed and the subscription
# page and publishes them on GitHub Pages. The weekly run keeps the feed at
# least 393 days ahead, and fails if the published feed is older than 8 days.
#
# GitHub disables a public repo's schedules after 60 days without activity;
# Renovate's commits keep this one alive.

"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a run on the default branch: it may be deploying.
  cancel-in-progress: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

permissions:
  contents: read

jobs:
  python:
    uses: mbologna/.github/.github/workflows/python-ci.yml@8afa698d74ff2cbfdb96ee637825753be6a15aa3 # main
    with:
      python_version: "3.15"
      enable_codecov: false
    secrets: inherit

  build:
    name: Build site
    needs: python
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          python-version: "3.15"

      # "Today" is the current date in Europe/Rome.
      - name: Build
        run: uv run --locked --no-dev day-of-year-calendar build --output-dir public

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: public

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  freshness:
    name: Check the published feed
    needs: deploy
    # Also runs when an earlier job failed, so a broken build or deploy shows
    # up as a stale feed too once it has gone on for over a week.
    if: ${{ !cancelled() && github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          python-version: "3.15"

      - name: Fail if the published feed is older than 8 days
        run: uv run --locked --no-dev day-of-year-calendar check --max-age-days 8
