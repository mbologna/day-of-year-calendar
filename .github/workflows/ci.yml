name: CI

"on":
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write
  security-events: write

jobs:
  lint:
    name: Lint PHP
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: shivammathur/setup-php@accd6127cb78bee3e8082180cb391013d204ef9f # v2
        with:
          php-version: "8.2"
      - run: php -l day-of-year-calendar.php

  docker:
    needs: lint
    uses: mbologna/.github/.github/workflows/docker-build-scan-push.yml@52c23f956da99f55be4ae1cb41ad09953953eee7 # main
    with:
      image_name: day-of-year-calendar
      push_to_dockerhub: false
      enable_grype: true
      enable_cosign: true
      enable_release_drafter: true
    secrets: inherit
