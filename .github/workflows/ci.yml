name: CI

"on":
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write
  security-events: write

jobs:
  lint:
    name: Lint PHP
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # v2
        with:
          php-version: "8.5"
      - run: php -l day-of-year-calendar.php

  test:
    needs: [lint]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # v2
        with:
          php-version: "8.5"
      - run: composer install --no-interaction --prefer-dist
      - run: vendor/bin/phpunit

  docker:
    needs: [lint, test]
    uses: mbologna/.github/.github/workflows/docker-ci.yml@efd33bde6e56c880365e83aab71f3242f40bc7f3 # main
    with:
      image_name: day-of-year-calendar
      push_to_dockerhub: true
      enable_grype: true
      enable_cosign: true
      enable_release_drafter: true
    secrets: inherit

  deploy:
    needs: [docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: mbologna/.github/.github/workflows/gcp-deploy.yml@efd33bde6e56c880365e83aab71f3242f40bc7f3 # main
    with:
      image_name: day-of-year-calendar
      deploy_type: service
      deploy_name: day-of-year-calendar
      region: us-central1
    secrets: inherit
