name: CI

"on":
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write
  security-events: write

jobs:
  php:
    uses: mbologna/.github/.github/workflows/php-ci.yml@6c12a94fd79c0e0b037fd126e568aa4f1f8e39f3 # main
    with:
      php_version: "8.5"
      enable_lint: true
      lint_tools: ""
      lint_command: php -l day-of-year-calendar.php

  docker:
    needs: [php]
    uses: mbologna/.github/.github/workflows/docker-ci.yml@6c12a94fd79c0e0b037fd126e568aa4f1f8e39f3 # main
    with:
      image_name: day-of-year-calendar
      push_to_dockerhub: true
      enable_grype: true
      enable_cosign: true
      enable_release_drafter: true
    secrets: inherit

  deploy:
    needs: [docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: mbologna/.github/.github/workflows/gcp-deploy.yml@6c12a94fd79c0e0b037fd126e568aa4f1f8e39f3 # main
    with:
      image_name: day-of-year-calendar
      deploy_type: service
      deploy_name: day-of-year-calendar
      region: us-central1
    secrets: inherit
