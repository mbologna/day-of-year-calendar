name: CI

"on":
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write
  security-events: write

jobs:
  lint:
    name: Lint PHP
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: shivammathur/setup-php@accd6127cb78bee3e8082180cb391013d204ef9f # v2
        with:
          php-version: "8.5"
      - run: php -l day-of-year-calendar.php

  test:
    needs: [lint]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: shivammathur/setup-php@accd6127cb78bee3e8082180cb391013d204ef9f # v2
        with:
          php-version: "8.5"
      - run: composer install --no-interaction --prefer-dist
      - run: vendor/bin/phpunit

  docker:
    needs: [lint, test]
    uses: mbologna/.github/.github/workflows/docker-build-scan-push.yml@aeb30e0b1fc4aef2b2c92b84dd07b87ab5e3ab6b # main
    with:
      image_name: day-of-year-calendar
      push_to_dockerhub: false
      enable_grype: true
      enable_cosign: true
      enable_release_drafter: true
    secrets: inherit

  deploy:
    needs: [docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: mbologna/.github/.github/workflows/gcp-deploy.yml@aeb30e0b1fc4aef2b2c92b84dd07b87ab5e3ab6b # main
    with:
      image_name: day-of-year-calendar
      ar_image: us-central1-docker.pkg.dev/day-of-year-cal/calendar/app
      deploy_type: service
      deploy_name: day-of-year-calendar
    secrets: inherit
